<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Text Button</title>
</head>
<body>
    <h2>Click the text below, then press Ctrl+C to copy:</h2>
    <p id="textToCopy" onclick="selectText()">This is the text to copy.</p>

    <script>
        function selectText() {
            var text = document.getElementById("textToCopy");
            var range = document.createRange();
            range.selectNode(text);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
        }
    </script>
</body>
</html>
